name: tests

on:
  pull_request:
    branches:
      - "14.0*"
  push:
    branches:
      - "14.0"
      - "14.0-ocabot-*"

jobs:
  unreleased-deps:
    runs-on: ubuntu-latest
    name: Detect unreleased dependencies
    steps:
      - uses: actions/checkout@v4
      - run: |
          for reqfile in requirements.txt test-requirements.txt ; do
              if [ -f ${reqfile} ] ; then
                  result=0
                  # Customization Escodoo
                  grep "^[^#].*pypi.org" ${reqfile} || result=$?
                  if [ $result -eq 0 ] ; then
                      echo "Unreleased dependencies found in ${reqfile}."
                      exit 1
                  fi
              fi
          done
  test:
    runs-on: ubuntu-22.04
    container: ${{ matrix.container }}
    name: ${{ matrix.name }}
    env:
      # TODO: re-enable egd_purchase_custom. It depends on
      # stock_request_purchase_request, whose 14.0 version declares
      # @api.depends("purchase_line_ids") on stock.request while its compute
      # actually reads purchase_request_line_ids. That field only exists when
      # stock_request_purchase is installed, which the module does not depend
      # on, so the registry fails to load. Already fixed in the 16.0 version of
      # the module (OCA/stock-logistics-warehouse PR 2511); the 14.0 one
      # (PR 1886, closed without merge) never got the fix.
      EXCLUDE: "egd_purchase_custom"
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: ghcr.io/oca/oca-ci/py3.6-odoo14.0:latest
            name: test with Odoo
          - container: ghcr.io/oca/oca-ci/py3.6-ocb14.0:latest
            name: test with OCB
            makepot: "true"
    services:
      postgres:
        image: postgres:9.6
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: odoo
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check out the unavailable Escodoo dependency
        uses: actions/checkout@v4
        with:
          repository: Escodoo/account-addons
          # Pinned source from the 14.0 branch.
          ref: 6786889d6791d317a72304aff3d876115b7cb81b
          path: .ci-deps/account-addons
          persist-credentials: false
      - name: Install the Escodoo cash flow integration
        # Install only this addon. oca_install_addons resolves its dependencies.
        run: >-
          pip install --no-deps
          ./.ci-deps/account-addons/setup/mis_builder_cash_flow_forecast_integration
      - name: Install addons and dependencies
        run: oca_install_addons
      - name: Check licenses
        run: manifestoo -d . check-licenses
      - name: Check development status
        run: manifestoo -d . check-dev-status --default-dev-status=Beta
      - name: Initialize test db
        run: oca_init_test_database
      - name: Run tests
        run: oca_run_tests
      - uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Update .pot files
        run: oca_export_and_push_pot https://x-access-token:${{ secrets.GIT_PUSH_TOKEN }}@github.com/${{ github.repository }}
        if: ${{ matrix.makepot == 'true' && github.event_name == 'push' && github.repository_owner == 'Escodoo' }}
